services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - hermes-postgres:/var/lib/postgresql/data

volumes:
  hermes-postgres:
